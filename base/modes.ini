/back {
unset %final
unset %endreverse
set %sections $token(0,32,*1)
:revstart
if (%sections == 0) goto revend  
set %reverseme $token(%sections,32,*1)
set %length $len(%reverseme)
set %backtext $mid(%length,1,%reverseme)  
dec %length 1  
:backstart
if (%length == 0) goto backend
set %tempback $mid(%length,1,%reverseme)
set %backtext %backtext $+ %tempback 
dec %length 1
goto backstart
:backend
set %reversed_text %backtext
set %temp %reversed_text
set %final %final %temp
dec %sections 1
goto revstart  
:revend
set %endreverse %final
say %final
}
/co {
unset %textfinal
set %rainbow *1
set %text.change 0
:beginning
inc %text.change
if %text.change > $len(%rainbow) goto end
set %rand1 $rand(1,15)
set %text2add  $+ %rand1 $+ $mid(%text.change,1,%rainbow) $+ 
if (%text.change == 1) { set %textfinal %text2add }
else set %textfinal %textfinal $+ %text2add
goto beginning
:end
say %textfinal
}
/altc {
set %altc $1-
%altc = $lower(%altc)
%altc = $strip(%altc)
%altc = $replace(%altc,a,A)
%altc = $replace(%altc,e,E)
%altc = $replace(%altc,i,I)
%altc = $replace(%altc,o,O)
%altc = $replace(%altc,u,U)
%altc = $replace(%altc,y,Y)
say %altc
}
/cot {
%num = 1
unset %msg
%msg = 
%color = p
:start
if %color == p { %num2 = 2 | %num3 = 4 | %color = y | goto add }
if %color == y  { %num2 = 9 | %num3 = 14 | %color = p | goto add }
:add
if $mid(%num,1, *1) != $null {
  %msg = %msg $+   $+ %num2 $+ , $+  %num3 $+  $mid(%num, 1,*1) $+   
  inc %num 
goto start  }
say %msg
}
/brick { %num = 1 | unset %msg  | %msg =  | %color = p
:start
if %color == p { %num2 = 1 | %num3 = 4 | %color = y | goto add }
if %color == y  { %num2 = 4 | %num3 = 1 | %color = p | goto add }
:add
if $mid(%num,1, *1) != $null {
  %msg = %msg $+   $+ %num2 $+ , $+  %num3 $+  $mid(%num, 1,*1) $+   
  inc %num 
goto start  }
say %msg
}
