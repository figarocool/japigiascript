n20=alias Setup.objects {
n21=  if ($inrect($1,$2,166,2,15,13)) { return ToolButton 166 2 15 13 }
n22=  if ($inrect($1,$2,0,0,190,13)) { return Titlebar }
n23=  if ($inrect($1,$2,15,32,150,30)) { return Button 15 32 150 30 }
n24=  if ($inrect($1,$2,15,68,150,30)) { return Button 15 68 150 30 }
n25=  if ($inrect($1,$2,15,105,150,30)) { return Button 15 105 150 30 }
n26=  if ($inrect($1,$2,15,141,150,30)) { return Button 15 141 150 30 }
n27=  if ($inrect($1,$2,15,179,150,30)) { return Button 15 179 150 30 }
n28=  if ($inrect($1,$2,15,215,150,30)) { return Button 15 215 150 30 }
n29=  if ($inrect($1,$2,15,251,150,30)) { return Button 15 251 150 30 }
n30=}
n31=alias Setup.do {
n32=  if ($inrect($1,$2,166,2,15,13)) { unset Setup.* | rrgui.close @Setup }
n33=  if ($inrect($1,$2,15,32,150,30)) { /protection | /ProtectStatus }
n34=  if ($inrect($1,$2,15,68,150,30)) { Multiserver:/set %me $$?="Set Nick:" | /set %username $$?="Username" | /set %ircname $$?="Server IRC:" | /multiconnect %ircname $$?="Server Port:"| halt }
n35=  if ($inrect($1,$2,15,105,150,30)) { /load  -rs $mircdirBase\Jappy.mrc }
n36=  if ($inrect($1,$2,15,141,150,30)) { /run $mircdir/Base/Sock.txt }
n37=  if ($inrect($1,$2,15,179,150,30)) { /F1 | halt }
n38=  if ($inrect($1,$2,15,215,150,30)) { /run $mircdir/Base/ok.bat | /exit }
n39=  if ($inrect($1,$2,15,251,150,30)) { unset Setup.* | rrgui.close @Setup }
n40=}
n41=menu @Setup {
n42=  sclick rrgui.handle sclick @Setup
n43=  mouse rrgui.handle mouse @Setup
n44=  uclick rrgui.handle uclick @Setup
n45=  dclick rrgui.handle sclick @Setup
n46=}
n47=;==>Menu'<==


