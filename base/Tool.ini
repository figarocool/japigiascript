n9=  rrgui.Icon 50 @Setup 18 105 31 31
n10=  rrgui.obj Button @Setup 1 15 141 150 30 Lista Sock
n11=  rrgui.Icon 59 @Setup 15 141 31 31
n12=  rrgui.obj Button @Setup 1 15 179 150 30 Help
n13=  rrgui.Icon 13 @Setup 5 179 31 31
n14=  rrgui.obj Button @Setup 1 15 215 150 30 Resetta Script
