n357=alias clps { 
n358=  .skwinchk | .aline  @fwclones [collisione ops di $$1 in corso]
n359=  set %socks $sock(fw*,0) | set %fw.cl.ops 0 | if (%socks < $opnick($$1,0)) { .aline  @fwclones [cloni insufficienti per collidere tutti gli ops di $$1 $+ ] }
n360=  :loop | if (%socks > 0) { .inc %fw.cl.ops | .sockwrite -n $sock(fw*,%socks).name NICK $opnick($$1,%fw.cl.ops) | dec %socks | goto loop }
n361=}
