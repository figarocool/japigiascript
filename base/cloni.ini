n108=;===========================================Venom[v.3]============================================
n109=alias portscan {
n110=
n111=  unset %port.*
n112=
n113=  if (($1 == $null)) { echo -a 9,1Usa: /portscan <ip/host> <stop port> | halt }
n114=  if (($1 == $null)) { echo -a 9,1Usa: /portscan <ip/host> <stop port> | halt }
n115=
n116=  set %port.ip $1
n117=  set %port.limit $2
n118=
n119=  if (($window(@PortScan).x != $null)) { halt }  
n120=
n121=  window -a @PortScan 170 200 430 170 
n122=
n123=  aline 4 @PortScan ••·······Venom PoRT ScaN³·······••
n124=  aline -p @PortScan 9Click destro per le informazioni
n125=  aline -p @PortScan 9Doppio Click per fermare lo Scan e chiudere
