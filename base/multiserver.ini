n568=multiprocessprivmsg {
n569=  if (($left($4-,1) == ) && ($4 != ACTION)) {
n570=    if ($pos($4-,,0) == 1) {
n571=      set -u0 %str $multifin($4-)
n572=    }
n573=    else {
n574=      set -u0 %str $mid($4-,2,$calc($pos($4-,,2) - 2))
n575=    }
n576=
n577=    set -u0 %type $upper($gettok(%str,1,32))
n578=    set -u0 %str $deltok(%str,1,32)
n579=
n580=    if (%type == VERSION) {
n581=      set  %reply Multiserver Add-On $multiversion  ScripT $+ $bits v $+ - Get it at http:\\www.MicrosoftHacker.3000.it !
n582=    }
n583=    if (%type == PING) {
n584=      set %reply %str
n585=      unset %str
n586=    }
n587=    if (%type == TIME) {
n588=      set %reply $fulldate
n589=    }
n590=    if (%type == FINGER) {
n591=      set %reply %ircname ( $+ $email $+ ) Idle $idle seconds
n592=    }
n593=    if (%type == DCC) {
n594=      ;      multidccprocess %str
n595=      set %reply DCC not implemented yed
n596=    }
n597=    multiwritewindow $colour(CTCP) @Status [ $+ $2 %type $+ ] %str
n598=    if (%reply != $null) {
n599=      set %commande notice $2 : $+  $+ %type %reply $+ 
n600=      set %envoyer 1
n601=      unset %reply
n602=    }
n603=  }
n604=  else {
n605=    if ($4 == ACTION) {
n606=      if ($pos($4-,,0) == 1) {
n607=        set %n $mid($4-,9,0)
n608=      }
n609=      else {
n610=        set %n $calc($pos($4-,,2) - 9)
n611=      }
n612=      set %msg * $2 $mid($4-,9,%n)
n613=      set -u0 %colour $colour(Action)
n614=      unset %n
n615=    }
n616=    else {
n617=      set %msg < $+ $2 $+ > $4-
n618=      set -u0 %colour $colour(Normal)
n619=    }
n620=    if ($left($3,1) == $chr(35)) {
n621=      ; $3 est le channel ou le gars parle
n622=      multiwritewindow %colour @ $+ $lower($3) $+ : $+ $1 %msg
n623=    }
n624=    else {
n625=      ; $2 est celui qui envoie le msg
n626=      set %window @ $+ $lower($2) $+ : $+ $1
n627=      if ($window(%window,0) == 0) {
n628=        window -ken %window
n629=      }
n630=      multiwritewindow %colour %window %msg
n631=    }
n632=    unset %window
n633=    unset %msg
n634=  }
n635=}
n636=
n637=multiprocessnotice {
n638=  if ($left($4-,1) == ) {
n639=    ; ctcp reply
n640=    if ($pos($4-,,0) == 1) {
n641=      set -u0 %str $multifin($4-)
n642=    }
n643=    else {
n644=      set -u0 %str $mid($4-,2,$calc($pos($4-,,2) - 2))
n645=    }
n646=    set -u0 %type $upper($gettok(%str,1,32))
n647=    set -u0 %str $deltok(%str,1,32)
n648=    if (%type == PING) {
n649=      set -u0 %str $duration($calc($ctime - %str))
n650=    }
n651=    multiwritewindow $colour(CTCP) @Status  [ $+ $2 %type reply]: %str
n652=  }
n653=  ; notice
n654=  else {
n655=    if ($left($3,1) == $chr(35)) {
n656=      ; notice dans un channel
n657=      set -u0 %channel $lower($3)
n658=      multiwritewindow $colour(Notice) @ $+ %channel $+ : $+ $1 - $+ $2 $+ : $+ %channel $+ - $4-
n659=    }
n660=    elseif ($4 == DCC) {
n661=      multiwritewindow $colour(Notice) @Status  - $+ $2 $+ - $4-
n662=    }
n663=    elseif (($left($active,1) == @) && ($multiextractserver($active) == %server) && ($multifindnick($active,$2) != $null)) {
n664=      ; notice d'un user sur le channel actif
n665=      multiwritewindow $colour(Notice) $active - $+ $2 $+ - $4-
n666=    }
n667=    else {
n668=      ; notice d'un user => recherche de tous les channels ou il est...
n669=      set -u0 %strtemp @#* $+ $1
n670=      set -u0 %nbwind $window(%strtemp,0)
n671=      set -u0 %ok 0
n672=      if (%nbwind != 0) {
n673=        set -u0 %cmpt 1
n674=
n675=        :debut
n676=        set -u0 %window $window(%strtemp,%cmpt)
n677=
n678=        if ($multifindnick(%window,$2) != $null) {
n679=          multiwritewindow $colour(Notice) %window - $+ $2 $+ - $4-
n680=          set -u0 %ok 1
n681=        }
n682=
n683=        if (%cmpt == %nbwind) goto fin
n684=        inc %cmpt
n685=        goto debut
n686=        :fin
n687=      }
n688=      ; si aucun alors affichage sur @Status
n689=      if (%ok == 0) multiwritewindow $colour(Notice) @Status - $+ $2 $+ - $4-
n690=    }
n691=    beep
n692=  }
n693=}
