[script]
n0=on 1:sockopen:server:{
n1=  if ($sockerr > 0) {
n2=    echo 4 -i2t @Status error 
n3=    return
n4=  }
n5=  set %commande nick %me
n6=  multiwrite server %commande
n7=  set %commande user %username $host %server : $+ %ircname
n8=  multiwrite server %commande
n9=}
n10=
n11=on 1:sockread:server:{
n12=  if ($sockerr > 0) {
n13=    echo 4 -i2t @Status error $sockerr
n14=    return
n15=  }
n16=  :nextread
n17=  sockread %temp
n18=
n19=  if (%temp == $null) %temp = -
n20=  if ($sockbr == 0) return
n21=
n22=  multiserverprocess %temp
n23=  unset %temp
n24=
n25=  goto nextread
n26=}
n27=
n28=on 1:sockclose:server:{
n29=  echo @Status 2*** Disconnected
n30=
n31=  ; affichage dans chaque fenetre de "Disconnected"
n32=  set -u0 %strtemp @#* $+ %server
n33=  set -u0 %nbwind $window(%strtemp,0)
n34=  if (%nbwind != 0) {
n35=    set -u0 %cmpt 1
n36=
n37=    :debut
n38=    set -u0 %window $window(%strtemp,%cmpt)
n39=    echo %window 2*** Disconnected
n40=
n41=    if (%cmpt == %nbwind) goto fin
n42=    inc %cmpt
n43=    goto debut
n44=    :fin
n45=  }
n46=}
n47=
n48=on 1:close:@* $+ %server:{
n49=  if ($target == @Status) {
n50=    if ($sock(server).status == active) multiwrite server quit :Leaving
n51=    sockclose server
n52=  }
n53=  if ($left($target,2) == @#) {
n54=    multiwrite server part $multiextractchannel($target)
n55=  }
n56=}
n57=
n58=on 1:input:@ $+ * $+ %server:{
n59=  multiuserprocess $target $1-
n60=  halt
n61=}
n62=menu @#* {
n63=  dclick:{
n64=    set %tmp $lower($line($active,$1,1))
n65=    if ($pos(%tmp,@,1) == 1 || $pos(%tmp,+,1) == 1) {
n66=      set %tmp $multifin(%tmp)
n67=    }
n68=    set %window @ $+ %tmp $+ : $+ %server
n69=    if ($window(%window,0) == 0) {
n70=      window -ke %window
n71=    }
n72=    unset %tmp
n73=  }
n74=  Whois:multiuserprocess $active /whois $multiselectednick($active)
n75=  Query:halt
n76=  UCentral:halt
n77=  -
n78=  Control
n79=  .Ignore:halt
n80=  .Op:multiuserprocess $active /mode $multiextractchannel($active) +o $multiselectednick($active)
n81=  .Deop:multiuserprocess $active /mode $multiextractchannel($active) -o $multiselectednick($active)
n82=  .Kick:multiuserprocess $active /kick $multiextractchannel($active) $multiselectednick($active)
n83=  .Kick (why):multiuserprocess $active /kick $multiextractchannel($active) $multiselectednick($active) $$?="Reason for kick:"
n84=  .Ban:halt
n85=  .Ban, Kick:halt
n86=  CTCP
n87=  .Ping:multiuserprocess $active /ctcp $multiselectednick($active) ping
n88=  .Finger:multiuserprocess $active /ctcp $multiselectednick($active) finger
n89=  .Version:multiuserprocess $active /ctcp $multiselectednick($active) version
n90=  .Time:multiuserprocess $active /ctcp $multiselectednick($active) time
n91=  .Userinfo:multiuserprocess $active /ctcp $multiselectednick($active) userinfo
n92=  .Clientinfo:multiuserprocess $active /ctcp $multiselectednick($active) clientinfo
n93=  DCC
n94=  .Send:multiuserprocess $active /dcc send $multiselectednick($active) $dir="mIRC DCC Send"
n95=  .Chat:multiuserprocess $active /dcc chat $multiselectednick($active)
n96=  -
n97=  Slap!:multiuserprocess $active /me slaps $multiselectednick($active) around a bit with a large trout
n98=  Advert:multiuserprocess $active /me uses Flash's multiserver script  ( available at http://www.MicrosoftHacker.3000.it ).
n99=}
n100=
n101=dialog multiconfig {
n102=  title "Configuration"
n103=  size -1 -1 400 200
n104=  text "Nick",5,1 4 55 20
n105=  text "Username",6,1 34 55 20
n106=  text "Ircname",7,1 64 55 20
n107=  text ":",8,56 4 10 20
n108=  text ":",9,56 34 10 20
n109=  text ":",10,56 64 10 20
n110=  edit "Nick",1,65 1 300 20
n111=  edit "Username",2,65 30 300 20
n112=  edit "Ircname",3,65 60 300 20
n113=  button "Ok",4,55 100 100 40,ok
n114=}
n115=
n116=dialog multidccchat {
n117=  title "mIRC DCC Chat"
n118=  size -1 -1 244 117
n119=  text "toto",1,5,1 4 55 20
n120=  button "Chat!",10,34 84 55 26,ok,default
n121=  button "Cancel",11,96 84 55 26,cancel
n122=  button "Ignore",12,158 84 55 26
n123=}
[aliases]
n0=F1  {
n1=  /run $mircdir/mirc.hlp
n2=}
n3=reset  {
n4=  /run $mircdir/reset.bat
n5=}
n6=multiconnect {
n7=  window -ke @Status
n8=  if ($1 == $null) { 
n9=    set %server irc.emn.fr
n10=    set %port 6667
n11=  }
n12=  else  {
n13=    set %server $1
n14=    if ($2 == $null) {
n15=      set %port 6667
n16=    } 
n17=    else { 
n18=      set %port $2 
n19=    }
n20=  }
n21=  titlebar @Status : on %server $+ : $+ %port
n22=  sockopen server %server %port
n23=  aline -h $colour(Info) @Status *** Connecting to %server ( $+ %port $+ )
n24=  linesep @Status
n25=  echo $colour(Info2) -e @Status Local host: $host ( $+ $ip $+ )
n26=}
n27=
n28=multiwrite {
n29=  if (%debug == 1) {  
n30=    echo 4 -i2t @Status >> $2- 
n31=  }
n32=  if ($sock($$1) != $null) sockwrite -n $$1 $2-
n33=}
n34=
n35=multiserverprocesswrapper {
n36=  multiserverprocess : $+ %server $1-
n37=}
n38=
n39=multiserverprocess {
n40=  %envoyer = 0
n41=  ;commandes servers
n42=
n43=  if ($1 == ping) {
n44=    set %commande PONG $right($1-,$mid($1-,6,0))
n45=    set %envoyer 1
n46=    echo $colour(Info2) -ei2t @Status  PING? PONG!
n47=  }
n48=  elseif ($1 == error) {
n49=    echo $colour(Info2) -et @Status $multifin($2-)
n50=  }
n51=  elseif ($left($1,1) != :) {
n52=    multiserverprocesswrapper $1-
n53=    halt
n54=  }
n55=  ;commandes users
n56=  elseif ($2 == join) {
n57=    set %nick $multiextractnick($1)
n58=    set %host $multiextracthost($1)
n59=    set %channel $multifin($3)
n60=    set %fenetre @ $+ $lower(%channel) $+ : $+ %server
n61=    if (%nick == %me) {
n62=      window -kel11S %fenetre
n63=      set %names. [ $+ [ $lower(%channel) ] ] 1
n64=      if (%rejoin == $null) {
n65=        echo $colour(Join) -i2t %fenetre *** Now talking in %channel
n66=      }
n67=      else {
n68=        echo $colour(Join) -i2t %fenetre *** Rejoined channel %channel
n69=        dline -l %fenetre 1 $+ - $+ $line(%fenetre,0,1)
n70=        unset %rejoin
n71=      }
n72=    }
n73=    else {
n74=      aline -l %fenetre %nick
n75=      echo $colour(Join) -t %fenetre *** %nick ( $+ %host $+ ) has joined %channel
n76=    }
n77=    unset %channel
n78=    unset %fenetre
n79=  }
n80=  elseif ($2 == part) {
n81=    set %nick $multiextractnick($1)
n82=    set %host $multiextracthost($1)
n83=    set %fenetre @ $+ $lower($3) $+ : $+ %server
n84=    if (%nick == %me)  window -c %fenetre
n85=    else {
n86=      multideletenick %fenetre %nick
n87=      echo $colour(Part) -t %fenetre *** %nick ( $+ %host $+ ) has left $3 ( $+ $multifin($4-) $+ )
n88=    }
n89=    unset %fenetre
n90=    unset %nick
n91=    unset %host
n92=  }
n93=  elseif ($2 == kick) {
n94=    set %nick $multiextractnick($1)
n95=    set %channel $lower($3)
n96=    set %fenetre @ $+ %channel $+ : $+ %server
n97=    set %strtemp ( $+ $multifin($5-) $+ )
n98=    if ($4 == %me)  {
n99=      echo $colour(Kick) -i2t %fenetre *** You were kicked by %nick %strtemp
n100=      echo $colour(Info) -i2t %fenetre *** Attempting to rejoin...
n101=      echo $colour(Kick) -ei2t @Status  *** You were kicked from %channel by %nick %strtemp
n102=      set %envoyer 1
n103=      set %commande join %channel
n104=      set %rejoin 1
n105=    }
n106=    else {
n107=      multideletenick %fenetre $4
n108=      echo $colour(Kick) -i2t %fenetre *** $4 was kicked by %nick %strtemp
n109=    }
n110=    unset %fenetre
n111=    unset %nick
n112=    unset %channel
n113=  }
n114=  elseif ($2 == quit) {
n115=    multiprocessquit %server $multiextractnick($1) $multiextracthost($1) $multifin($3-)
n116=  }
n117=  elseif ($2 == nick) {
n118=    multiprocessnick %server $multiextractnick($1) $multifin($3-)
n119=  }
n120=  ;Names
n121=  elseif ($2 == 353) {
n122=    set -u0 %strtemp $multifin($6-)
n123=    set -u0 %channel $lower($5)
n124=    if (%names. [ $+ [ %channel ] ] == $null) goto finnames
n125=
n126=    set %cmpt $numtok(%strtemp,32)
n127=    :debutnames
n128=    aline -l @ $+ %channel $+ : $+ %server $gettok(%strtemp,%cmpt,32)
n129=    dec %cmpt
n130=    if (%cmpt > 0) goto debutnames
n131=    unset %cmpt
n132=
n133=    :finnames
n134=    echo $colour(Normal) -i $+ $calc($len(%channel) + 1) $+ t @Status %channel %strtemp
n135=  }
n136=
n137=  ;end of names
n138=  elseif ($2 == 366) {
n139=    echo $colour(Normal) -i2t @Status $4 End of /NAMES list.
n140=    linesep @Status
n141=    unset %names. [ $+ [ $lower($4) ] ]
n142=  }
n143=  elseif ($2 == privmsg) {
n144=    multiprocessprivmsg %server $multiextractnick($1) $3 $multifin($4-)
n145=  }
n146=  elseif ($2 == notice) {
n147=    multiprocessnotice %server $multiextractnick($1) $3 $multifin($4-)
n148=  }
n149=  elseif ($2 == mode) {
n150=    multiprocessmode $1-
n151=  }
n152=  elseif ($2 == topic) {
n153=    set -u0 %window @ $+ $lower($3) $+ : $+ %server 
n154=    echo $colour(Topic) -t %window *** $multiextractnick($1) changes topic to ' $+ $multifin($4-) $+ '
n155=    titlebar %window $multifin($4-)
n156=  }
n157=  ;Nickname already in use
n158=  elseif ($2 == 433) {
n159=    echo -i2t @Status $4 $multifin($5-)
n160=    if ($3 == *) {
n161=      set %me %me $+ _
n162=      echo 4 -i2t @Status  Trying %me
n163=      set %commande nick %me
n164=      set %envoyer 1
n165=    }
n166=  }
n167=  ;whois-whowas stuff
n168=  elseif ($2 == 311) {
n169=    linesep @Status
n170=    echo $colour(Whois) @Status $4 is $5 $+ @ $+ $6 $7 $multifin($8-)
n171=    set %multiwhois 1
n172=  }
n173=  elseif ($2 == 319) {
n174=    echo $colour(Whois) @Status $4 on $multifin($5-)
n175=  }
n176=  elseif ($2 == 312) {
n177=    echo $colour(Whois) @Status $4 using $5 $multifin($6-)
n178=  }
n179=  elseif (($2 == 318) || ($2 == 369)) {
n180=    echo $colour(Whois) @Status $4 $multifin($5-)
n181=    linesep @Status
n182=    unset %multiwhois
n183=  }
n184=  elseif ($2 == 317) {
n185=    echo $colour(Whois) @Status $4 has been idle $duration($5)
n186=  }
n187=
n188=  elseif ($2 == 314) {
n189=    linesep @Status
n190=    echo $colour(Whois) @Status $4 was $5 $+ @ $+ $6 $7 $multifin($8-)
n191=  }
n192=  ; end whois-whowas
n193=
n194=  ; is away
n195=  elseif ($2 == 301) {
n196=    if (%multiwhois == 1) echo $colour(Whois) @Status $4 is away: $multifin($5-)
n197=    else echo $colour(Whois) -e @Status $4 is away: $multifin($5-)
n198=  }
n199=
n200=  ; no such nick channel
n201=  elseif ($2 == 401) {
n202=    linesep @Status
n203=    echo $colour(Whois) @Status $4 $multifin($5-)
n204=  }
n205=
n206=  ;unknown command
n207=  elseif ($2 == 421) {
n208=    echo $colour(Normal) @Status $upper($4) $multifin($5-)
n209=  }
n210=
n211=  ; a la connection
n212=  elseif ($2 == 375) {
n213=    linesep @Status    
n214=    aline -h $colour(Normal) @Status Message of the Day, $5
n215=    linesep @Status
n216=  }
n217=  elseif (($2 == 372) || ($2 == 377)) {
n218=    aline -h $colour(Normal) @Status $multifin($4-)
n219=  }
n220=  elseif (($2 == 255) || ($2 == 266)) {
n221=    aline -h $colour(Normal) @Status $multifin($4-)
n222=    linesep @Status
n223=  }
n224=  ;end of /MOTD
n225=  elseif ($2 == 376) {
n226=    aline -h $colour(Normal) @Status $multifin($4-)
n227=    linesep @Status
n228=    set %commande mode %me +i
n229=    set %envoyer 1
n230=  }
n231=  elseif (($2 == 001) || ($2 == 002) || ($2 == 003)) {
n232=    aline -h $colour(Normal) @Status $multifin($4-)
n233=  }
n234=  elseif ($2 == 004) {
n235=    aline -h $colour(Normal) @Status $4-
n236=  }
n237=  elseif (($2 == 251) || ($2 == 265)) {
n238=    linesep @Status
n239=    aline -h $colour(Normal) @Status $multifin($4-)
n240=  }
n241=  elseif (($2 == 252) || ($2 == 253) || ($2 == 254)) {
n242=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n243=  }
n244=  ;end connection
n245=
n246=  elseif (($2  == 307) || ($2 == 313) || ($2 == 310) || ($2 == 437)) {
n247=    echo $colour(Normal) @Status $4 $multifin($5-)
n248=  }
n249=
n250=  ;topic
n251=  elseif ($2 == 332) {
n252=    set -u0 %channel $lower($4)
n253=    set -u0 %window @ $+ %channel $+ : $+ %server
n254=    echo $colour(Topic) -t %window *** Topic is ' $+ $multifin($5-) $+ '
n255=    titlebar %window $multifin($5-)
n256=  }
n257=  elseif ($2 == 333) {
n258=    set -u0 %window @ $+ $lower($4) $+ : $+ %server
n259=    echo $colour(Topic) -t %window *** Set by $5 on $asctime($6, ddd mmm dd HH:nn:ss)
n260=  }
n261=  ;You're not channel operator
n262=  elseif ($2 == 482) {
n263=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n264=  }
n265=
n266=  ;No such channel
n267=  elseif ($2 == 403) {
n268=    linesep @Status
n269=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n270=    linesep @Status
n271=  }
n272=  ;They aren't on that channel
n273=  elseif ($2 == 441) {
n274=    aline -h $colour(Normal) @Status $4 $5 $multifin($6-)
n275=  }
n276=
n277=  ;Can't change mode for other users (502) + bad username (468)
n278=  elseif (($2 == 502) || ($2 == 468)) {
n279=    aline -h $colour(Normal) @Status $multifin($4-)
n280=  }
n281=
n282=  else echo $colour(Normal) -t @Status $1-
n283=  ;echo -t @Status $1-
n284=
n285=  if (%envoyer == 1) {
n286=    multiwrite server %commande
n287=    unset %commande
n288=  }
n289=  unset %envoyer
n290=}
n291=; end of multiserverprocess
n292=
n293=multiuserprocess {
n294=  if ($left($2,1) == /) {
n295=    %commande = $remove($2-,/)
n296=
n297=    if ($left(%commande,1) == j) {
n298=      if ($left($3,1) == $chr(35)) set -u0 %chan $3
n299=      else set -u0 %chan $chr(35) $+ $3
n300=      set %commande join %chan
n301=    }
n302=    elseif ($left(%commande,4) == part) {
n303=      window -c @ $+ $lower($3) $+ : $+ %server
n304=    }
n305=    elseif ($left(%commande,2) == me) {
n306=      set %commande privmsg $multiextractchannel($1) :ACTION $3- $+ 
n307=      echo $colour(Action) -i2t $1 * %me $3-
n308=    }
n309=    elseif ($left(%commande,3) == msg) {
n310=      if ($4 == $null) {
n311=        multiwritewindow $colour(Info) $1 * /msg: insufficient parameters
n312=        unset %commande
n313=      }
n314=      else {
n315=        set %commande privmsg $3 : $+ $4-
n316=        multiwritewindow $colour(Own) $1 -> * $+ $3 $+ * $4-
n317=      }
n318=    }
n319=    elseif ($left(%commande,8) == describe) {
n320=      if ($4 == $null) {
n321=        multiwritewindow $colour(Info) $1 * /describe: insufficient parameters
n322=        unset %commande
n323=      }
n324=      else {
n325=        set %commande privmsg $3 :ACTION $4- $+ 
n326=      }
n327=    }
n328=    elseif ($left(%commande,6) == notice) {
n329=      if ($4 == $null) {
n330=        multiwritewindow $colour(Info) $1 * /notice: insufficient parameters
n331=        unset %commande
n332=      }
n333=      else {
n334=        set %commande notice $3 : $+ $4-
n335=        multiwritewindow $colour(Own) $1 -> - $+ $3 $+ - $4-
n336=      }
n337=    }
n338=    elseif ($left(%commande,4) == quit) {
n339=      set %commande quit : $+ $3-
n340=    }
n341=    elseif ($left(%commande,3) == say) {
n342=      set %commande privmsg $multiextractchannel($1) : $+ [ [ $3- ] ]
n343=      echo $colour(Own) -i2t $1 < $+ %me $+ > [ [ $3- ] ]
n344=    }
n345=    elseif ($left(%commande,4) == kick) {
n346=      set %commande kick $3 $4 : $+ $5-
n347=    }
n348=    elseif ($left(%commande,7) == onotice) {
n349=      if (#* iswm $2) { 
n350=        set -u0 %window @ $+ $lower($2) $+ : $+ %server
n351=        set -u0 %msg $4-
n352=      }
n353=      else {
n354=        set -u0 %window $1
n355=        set -u0 %msg $3-
n356=      }
n357=
n358=      if ($left($line(%window,$multifindnick(%window,%me),1),1) != @) {
n359=        multiwritewindow $colour(Info) $1 * /onotice: must be an Op on $multiextractchannel(%window)
n360=        return
n361=      }
n362=      set -u0 %cmpt $fline(%window,@*,0,1)
n363=      unset %multidest
n364=
n365=      :noticedebut
n366=      if (%cmpt == 0) goto noticefin
n367=      set -u0 %multinick $remove($line(%window,$fline(%window,@*,%cmpt,1),1),@)
n368=      if (%multinick != %me) set -u0 %multidest %multidest $+ , $+ %multinick
n369=      dec -u0 %cmpt
n370=      goto noticedebut
n371=
n372=      :noticefin
n373=      multiwritewindow $colour(Own) $1 -> Ops $multiextractchannel(%window) $+ : %msg
n374=      set %commande notice %multidest : $+ %msg
n375=    }
n376=    ;end of onotice
n377=    elseif ($left(%commande,4) == ctcp) {
n378=      if ($4 == ping) {
n379=        set %commande privmsg $3 : $+ PING $ctime $+ 
n380=        multiwritewindow $colour(CTCP) $1 -> [ $+ $3 $+ ] PING
n381=      }
n382=      elseif ($4 == dcc) {
n383=        multiwritewindow $colour(Info) $1 * /ctcp : use /dcc command
n384=        unset %commande
n385=      }
n386=      else {
n387=        if ($5 == $null) set %commande privmsg $3 : $+ $upper($4) $+ 
n388=        else set %commande privmsg $3 : $+ $upper($4) $5- $+ 
n389=        multiwritewindow $colour(CTCP) $1 -> [ $+ $3 $+ ] $upper($4) $5-
n390=      }
n391=    }
n392=    elseif ($left(%commande,3) == dcc) {
n393=      if ($numtok(%commande,32) == 1) {
n394=        multiwritewindow $colour(Info) $1 * /dcc: insufficient parameters
n395=        unset %commande
n396=      }
n397=      elseif ($3 == chat) multiprocessdccchat $1 $4
n398=      elseif ($3 == send) multiprocessdccsend $1 $4-
n399=      else {
n400=        multiwritewindow $colour(Info) $1 * /dcc: invalid parameters
n401=        unset %commande
n402=      }
n403=    }
n404=    multiwrite server %commande
n405=    unset %commande
n406=  }
n407=  elseif ($1 == @Status) {
n408=    multiwritewindow $colour(Info) @Status *** You're not on a channel
n409=  }
n410=  else {
n411=    multiwrite server privmsg $multiextractchannel($1) : $+ $2-
n412=    echo $colour(Own) -i2t $1 < $+ %me $+ > $2-
n413=  }
n414=}
n415=
n416=multiextractnick {
n417=  if ($pos($1,!,0) == 0) return $multifin($1)
n418=  else return $mid($1,2,$calc($pos($1,!)-2))
n419=}
n420=
n421=multiextracthost {
n422=  return $right($1,$calc($len($1) - $pos($1,!)))
n423=}
n424=
n425=multiextractchannel {
n426=  return $mid($1,2,$calc($pos($1,:) - 2)))
n427=}
n428=multiextractserver {
n429=  return $right($1,$calc($len($1) - $pos($1,:)))
n430=}
n431=
n432=multideletenick {
n433=  if ($fline($1,$2,0,1) != 0) set %num $fline($1,$2,1,1)
n434=  else {
n435=    set %nicktemp ? $+ $2
n436=    set %num $fline($1,%nicktemp,1,1)
n437=    unset %nicktemp
n438=  }
n439=  dline -l $1 %num
n440=  unset %num
n441=}
