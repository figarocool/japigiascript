n443=multiprocessquit {
n444=  echo $colour(Quit) -et @Status  *** $2 ( $+ $3 $+ ) Quit ( $+ $4- $+ )
n445=
n446=  set -u0 %strtemp @#* $+ $1
n447=  set -u0 %nbwind $window(%strtemp,0)
n448=  if (%nbwind == 0) return
n449=  set -u0 %cmpt 1
n450=
n451=  :debut
n452=  set -u0 %window $window(%strtemp,%cmpt)
n453=
n454=  set %num -1
n455=  if ($fline(%window,$2,0,1) != 0) set %num $fline(%window,$2,1,1)
n456=  else {
n457=    set %nicktemp ? $+ $2
n458=    if ($fline(%window,%nicktemp,0,1) != 0)  set %num $fline(%window,%nicktemp,1,1)
n459=    unset %nicktemp
n460=  }
n461=  if (%num != -1) {
n462=    dline -l %window %num
n463=    echo $colour(Quit) -t %window *** $2 has quit IRC ( $+ $4- $+ )
n464=  }
n465=  unset %num
n466=
n467=  if (%cmpt == %nbwind) return
n468=  inc %cmpt
n469=  goto debut
n470=}
n471=
n472=multiprocessnick {
n473=  if ($2 == %me) {
n474=    multiwritewindow $colour(Nick) @Status *** Your nick is now $3
n475=    set %me $3
n476=  }
n477=  set -u0 %strtemp @#* $+ $1
n478=  set -u0 %nbwind $window(%strtemp,0)
n479=  if (%nbwind == 0) goto suite
n480=  set -u0 %cmpt 1
n481=
n482=  :debut
n483=  set -u0 %window $window(%strtemp,%cmpt)
n484=
n485=  if ($fline(%window,$2,0,1) != 0) {
n486=    rline -l %window $fline(%window,$2,1,1) $3
n487=    multiwritewindow $colour(Nick) %window *** $2 is now known as $3
n488=  }
n489=  else {
n490=    set %nicktemp ? $+ $2
n491=    if ($fline(%window,%nicktemp,0,1) != 0)  {
n492=      set -u0 %num $fline(%window,%nicktemp,1,1)
n493=      set %char $left($line(%window,%num,1),1)
n494=      rline -l %window %num %char $+ $3
n495=      multiwritewindow $colour(Nick) %window *** $2 is now known as $3
n496=      unset %char
n497=    }
n498=    unset %nicktemp
n499=  }
n500=
n501=  if (%cmpt == %nbwind) goto suite
n502=  inc %cmpt
n503=  goto debut
n504=
n505=  :suite
n506=  set -u0 %window1 @ $+ $lower($2) $+ : $+ %server
n507=  set -u0 %window2 @ $+ $lower($3) $+ : $+ %server
n508=  if ($window(%window1,0) == 0) return
n509=  renwin %window1 %window2 
n510=}
n511=
n512=multiprocessmode {
n513=  if ($left($3,1) == $chr(35)) {
n514=    set %nick $multiextractnick($1)
n515=    set -u0 %window @ $+ $lower($3) $+ : $+ %server
n516=
n517=    set %cmpt 1
n518=    set %currp 5
n519=
n520=    :loop
n521=    set %curr $mid($4,%cmpt,1)
n522=    if (%curr == +) { set %add 1 }
n523=    elseif (%curr == -) { set %add  0 }
n524=    elseif (%curr == b) { inc %currp }
n525=    elseif (%curr == o) {
n526=      set %opped $gettok($1-,%currp,32)
n527=      if (%add == 1) {
n528=        set %opped2 @ $+ %opped
n529=      } 
n530=      else { 
n531=        set %opped2 %opped 
n532=      }
n533=      rline -l %window $multifindnick(%window,%opped) %opped2
n534=      inc %currp
n535=      unset %opped*
n536=    }
n537=    elseif (%curr == v) {
n538=      set %opped $gettok($1-,%currp,32)
n539=      set %num $multifindnick(%window,%opped)
n540=      if ($left($line(%window,%num,1),1) != @) {
n541=        if (%add == 1) {
n542=          set %opped2 + $+ %opped
n543=        } 
n544=        else { 
n545=          set %opped2 %opped 
n546=        }
n547=        rline -l %window %num %opped2
n548=      }
n549=      inc %currp
n550=      unset %num
n551=      unset %opped*
n552=    }
n553=    elseif (%curr == l) { inc %currp }
n554=    elseif (%curr == k) { inc %currp }
n555=    if (%cmpt < $len($4)) {
n556=      inc %cmpt
n557=      goto loop
n558=    }
n559=    unset %curr
n560=    unset %currp
n561=    unset %cmpt
n562=    multiwritewindow $colour(Mode) %window *** %nick sets mode: $4 $5-
n563=  }
n564=  else { multiwritewindow $colour(Mode) @Status *** $3 sets mode: $multifin($4) }
n565=
n566=}
