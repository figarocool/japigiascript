/rco {
set %i $replace(*1,$chr(32), ) | set %i $left(200,%i) | set %o $chr(3) $+ 4,1 | set %p 1 | set %c 1
:loop
set %o %o $+ $chr(3) $+ $token( %c , 38 , 4&7&8&9&11&13 ) $+ $mid(%p,1,%i) 
inc %p
if ( $mid(%p,1,%i) !=  ) { inc %c }
if ( %c > 6 ) { set %c 1 }
if ( $mid(%p,1,%i) != $null ) { goto loop }
say %o
unset %o %i %p %c
}

