n53=/stealth? {
n54=  /window -c @PA_Stealthmode
n55=  /window -k +el @PA_StealthMode 100 100 300 400 Tahoma 13
n56=  /echo $active 9[14Stealth Mode Help9]
n57=  /echo $active 14Commands: Press 9F1114 or type 9/stealthon14 turn stealth mode ON, 9Shift + F1114 or type 9/stealthoff14 turn stealth mode OFF
n58=  /echo $active 9-----------------------------------------------------
n59=  /echo $active 14Ok.. lets say you just wanna go quickly inside a server to check out if a certain friend is in and then leave... or for some reason to be undercover..the last thing you want is ppl to see you and start talking to you and stuff like that.. stealth mode will alter your nickname (duh?), VERSION, PING, TIME and FINGER replies (that the script has). and you'll be pretty undercover.. you only have to remeber to change your IRC name before entering... thats it :)
n60=
