/pa? {
  /window -c @PA_help
  /window -k +el @PA_Help 100 10 600 600 Tahoma 13
  /echo $active 9[14P.A. Script Help Screen9]
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
  /echo $active 14  This is a fast reference to some basic commands of this script
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
  /echo $active 14Type 9/pass 14while online for nickserv identification
  /echo $active 14Type 9/ls14 to get a list of all channels in server
  /echo $active 14Type 9/? %mynick 14to get a whois on %mynick , 9 /?? 14to get more info on someone
  /echo $active 14Type 9/os14 to show your operating system to other ppl...
  /echo $active 14Type 9/tel 14to show 9[14Phone9]14 in all active channels and change to %mynickphone
  /echo $active 14Type 9/go2url14 to show to other ppl the current URL you have on your browser
  /echo $active 14Type 9/all14 to say something to all channels..
  /echo $active 14Type 9/x14 to part the active channel
  /echo $active 14Type 9/grv14 to join #groovy, 9/xen14 to join #xenitemenoi, 9/sx14 to join #esSEX, 9/tcs14 to join #tHe_ConspIratOrz
  /echo $active 14Type 9/pathx 14 to check out a list of ppl i wanna thank! :)
  /echo $active 14Finally type 9/pa14 to advertise the script :p
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
  /echo $active 14Various laugh and talk modes include:9 /lol14, 9/rofl14, 9/:)14, 9/mou14, 9/xax14, 9/xa14, 9/kik14, 9/re14, 9/goal14, 
  /echo $active 9/kala14, 9/grr14, 9/har14, 9oust14, 9/cu14, 9/bye14, 9/think
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
  /echo $active 1,1&&14If you like the script or you have any comments (even bad ones) i would like to hear them!:) This script was made only for me and it has only been released to the public because some ppl asked for it... that means that it's 4NOT14 intented to be a powerful script not even a good one ;).. just something i did because i h8ed having to use other ppl's stupid scripts... and to learn mIRC scripting of course!!
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
  /echo $active 14Comments, suggestions: 9onliner@iname.com14, or my homepage.. ask me for the url :)
  /echo $active 9-----------------------------------------------------------------------------------------------------------------
}

