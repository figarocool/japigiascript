n66=  /echo $active 9-----------------------------------------------------------------------------------------------------------------
n67=  /echo $active 9P.A. Theme:14 ok this is one of my script's best features... I have changed all the " *** Joins bla bla bla " style messages to new kooler ones! You can always turn it off and use the old classic mIRC theme :)
n68=  /echo $active 9Join Part Ban:14 when a user joins and parts really fast, the script bans him for 30 sec to avoid join part flooding. (turn on and off using the Script submenu).
