n70=  /echo $active 9DeOp - DeVoice Protection:14 if someone is in your friend, best friend, bot op or bot admin list he is automatically protected from DeOping and DeVoiceing. This feature can be turned off using the Menubar Popup.
n71=  /echo $active 9AntiOp - AntiVoice Protection:14 DeOps or DeVoices Enemies and kicks the user who oped or voiced them. This can also be turned off by the same popup.
n72=  /echo $active 9Flood Protection:14 If you're an OP in a channel the last thing you want is ppl to screw it up! this will kick flooders away from the channel using a No Flooding message. Turned on and off from the menubar.
n73=  /echo $active 9KickBan Protection:14 Take overs? they're over for u! if u get kickbanned from your channel the script will quickly unban u, invite u an kick the lamer outta there!. Turned on and off from the menubar.
n74=  /echo $active 9No Bans Allowed:14 ok! no bans allowed in the channel you are in.. only the bans U make are ok... your script will -b every other ban!. Turned on and off from the menubar.
n75=  /echo $active 9Stealth Mode:14 type 9/stealth?14 for more info.
n76=  /echo $active 9Bot Mode:14 type 9/bot?14 for more info.
