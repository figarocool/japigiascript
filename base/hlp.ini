n80=/bot? {
n81=  /window -c @PA_BotMode
n82=  /window -k +el @PA_BotMode 100 100 800 800 Tahoma 13
n83=  /echo $active 9[14Bot Mode Help9] 
n84=  /echo $active 14Commands: Press 9F1014 or type 9/boton14 turn bot mode ON, 9Shift + F1014 or type 9/botoff14 turn bot mode OFF
n85=  /echo $active 9------------------------------------------------------------------------------------------------
n86=  /echo $active 14I created the P.A. BOT in order to be able to use it by remote and to enable my friends to get ops, voices etc when i'm not there to give it to them. basically it works with user levels... (user lists with the different user levels are located at the nickname popup). The user levels are 7, and are  explained below...
n87=  /echo $active 9------------------------------------------------------------------------------------------------
n88=  /echo $active 9Level 114 are all the users on the irc server.
n89=  /echo $active 9Level 214 are good friends, aquaintances... once added to Friend list they receive +v everytime they join a channel in which you have ops..
n90=  /echo $active 9Level 314 are very good friends...once added to the Very Good Friend list they receive +o everytime they join a channel in which you have ops..
n91=  /echo $active 9Level 414 are BOT Operators.. that normally means that they can do things with the bot.. i havent yet made anything on this user level so they cant do anything :) they receive ops and voices at will just as the other groups can..
n92=  /echo $active 9Level 514 must be ONLY you.. this level is very powerful.. using this level's commands you can kick, ban, op, voice, talk and even spy to what ppl are saying to the bot :)))
n93=  /echo $active 9Level 614 are IRC's biggest problem! Annoying brats that enter a channel and think they're "elite" and cool.. add them to the annoying list and they'll receive a kick everytime they join a channel in which you have ops...
n94=  /echo $active 9Level 714 are your ENEMIES! yep.. everyone has some.. add them to the enemy list and see them vanish and never come back! kickban that is from every channel they join in which u have ops!!
n95=  /echo $active 9------------------------------------------------------------------------------------------------
n96=  /echo $active 9Levels 2,3,4,514 may private message the bot saying 9!voice #channel14 to receive voice on the selected channel
n97=  /echo $active 9Levels 3,4,514 may private message the bot saying 9!op #channel14 to receive ops on the selected channel
n98=  /echo $active 9Level 514 has the following commands(executed by remote client): 9?14 to see the global variable contents, 9!nn 14to set global nickname variable, 9!#14 to set the global channel variable, 9!?14 to set the global message variable, 9!cmd </command>14 to execute commands directly by remote, 9!op14 to op user in channel both specified by global vars, 9!deop14 to deop user in channel both specified by global vars, 9!voice14 to voice user in channel both specified by global vars, 9!devoice14 to devoice user in channel both specified by global vars, 9!kick14 to kick user in channel with message all specified by global vars, 9!ban14 to ban user in channel both specified by global vars,9!join14 channel specified by global var, 9!part14 to part channel specified by global var, 9!quit14 to quit server using message var, 9!exit14 to
n99=  /echo $active 14completely shutdown the script, 9!fwon14 spy on what other ppl say to the bot, 9!fwoff14 to stop forwarding, 9!help14 to get the bot's help topics. (phewww)
n100=  /echo $active 9------------------------------------------------------------------------------------------------
n101=}
