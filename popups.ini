n177=..flood ctcp:{ fwctcp $$?="Nick/Canale?" }
n178=..flood cambi nick:{ fw.nickflood | .timer 1 6 /fw.nickflood | .timer 1 12 /fw.nickflood | .timer 1 18 /fw.nickflood }
n179=..-
