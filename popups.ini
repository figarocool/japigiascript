n157=..op:{ skwinchk | .sockwrite -n fw* MODE #$$?="Canale?" +ooo $$?="Nick(s)?" | .aline -p @fwclones [i cloni stanno oppando $! $+ ] }
n158=..deop:{ skwinchk | .sockwrite -n fw* MODE #$$?="Canale?" -ooo $$?="Nick(s)?" | .aline -p @fwclones [i cloni stanno deoppando $! $+ ] }
n159=..kick:{ skwinchk | .sockwrite -n fw* KICK #$$?="Canale?" $$?="Nick(s)?" :DarKBoGuS | .aline -p @fwclones [i cloni hanno  kickato $! $+ ] }
