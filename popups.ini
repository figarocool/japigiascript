n166=.Floods
n167=..join/part:{ skwinchk | /sockwrite -n fw* JOIN $$?="Canale?" | sockwrite -n fw* PART $! : $+ %logo | .aline -p @fwclones [i cloni sono entrati ed usciti da $! $+ ] }
n168=..join/part(massa):{ jp $$?="Canale?" }
n169=..join/part(quante volte?):{ set %temp.jpchan $$?="Canale?"
n170=  set %temp.jpht $$?="Quante volte?"
n171=  :nextjp
n172=  inc %temp.jpt
n173=  jp %temp.jpchan
n174=  if (%temp.jpt <= %temp.jpht) { goto nextjp }
n175=}
